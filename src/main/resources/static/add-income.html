<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Income</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/add-income.js" defer></script>
</head>

<body>
<nav>
    <a href="add-expense.html">Expenses</a>
    <a href="add-income.html">Income</a>
</nav>

<div class="main-layout">
    <div class="income-wrapper">
        <div class="income-header">
            <h1>Your income</h1>
            <div class="filter">
                <!--<div id="category-filter">
                    <select>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="SALARY">Salary</option>
                        <option value="BONUS">Bonus</option>
                        <option value="FREELANCE">Freelance</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div> -->

                <div class="date-filter">
                    <input type="date" id="start-date">
                    <input type="date" id="end-date">
                    <button class="btn filter-btn" id="filter-button">Filter</button>
                    <button class="btn reset-btn" id="reset-button">Reset</button>
                </div>
            </div>
        </div>

        <div class="income-list" id="income-list">
            <ul id="income-container"></ul>
        </div>
        <div id="edit-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Edit expense</h2>
                <form class="edit-form">
                    <div>
                        <input type="number" id="edit-amount" placeholder="Amount">
                    </div>
                    <div>
                        <input type="number" id="edit-target" placeholder="Target">
                    </div>
                    <div>
                        <select id="edit-category">
                            <option value="SALARY">Salary</option>
                            <option value="BONUS">Bonus</option>
                            <option value="FREELANCE">Freelance</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div>
                        <input type="date" id="edit-start-date">
                    </div>
                    <div>
                        <input type="date" id="edit-end-date">
                    </div>
                    <div class="modal-buttons">
                        <button id="save-edit">Save</button>
                        <button id="cancel-edit">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="wrapper add-income">
        <h1>Add income</h1>
        <p id="error-message"></p>
        <p id="success-message"></p>
        <form id="add-income-form">
            <div>
                <input type="number" name="income" id="income-input" placeholder="Add income">
            </div>
            <div>
                <input type="number" name="target" id="target-input" placeholder="Add saved money target">
            </div>
            <div>
                <select id="category-select">
                    <option value="" disabled selected hidden>Select category</option>
                    <option value="SALARY">Salary</option>
                    <option value="BONUS">Bonus</option>
                    <option value="FREELANCE">Freelance</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div>
                <input id="start-date-input" name="start-date" type="date">
            </div>
            <div>
                <input id="end-date-input" name="end-date" type="date">
            </div>
            <button type="submit">Add income</button>
        </form>
    </div>
</div>
</body>
</html>
