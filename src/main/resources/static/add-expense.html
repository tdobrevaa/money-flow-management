<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Expenses</title>
        <link rel="stylesheet" href="css/style.css">
        <script type="text/javascript" src="js/add-expense.js" defer></script>
    </head>

    <body>
        <nav>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-expense.html">Expenses</a>
                <a href="add-income.html">Income</a>
            </div>
        </nav>

        <div class="main-layout">
            <div class="expense-wrapper">
                <div class="expense-header">
                    <h1>Your expenses</h1>
                    <div class="filter">
                        <!--<div id="category-filter">
                            <select>
                                <option value="" disabled selected hidden>Select category</option>
                                <option value="CLOTHING">Clothing</option>
                                <option value="FOOD">Food</option>
                                <option value="TAXI">Taxi</option>
                                <option value="PHARMACY">Pharmacy</option>
                                <option value="RESTAURANT">Restaurant</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div> -->

                        <div class="date-filter">
                            <input type="date" id="start-date">
                            <input type="date" id="end-date">
                            <button class="btn filter-btn" id="filter-button">Filter</button>
                            <button class="btn reset-btn" id="reset-button">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="expenses-list" id="expenses-list">
                    <ul id="expenses-container"></ul>
                </div>
                <div id="edit-modal" class="modal hidden">
                    <div class="modal-content">
                        <h2>Edit expense</h2>
                        <form class="edit-form">
                            <div>
                                <input type="number" id="edit-amount" placeholder="Amount">
                            </div>
                            <div>
                                <select id="edit-category">
                                    <option value="CLOTHING">Clothing</option>
                                    <option value="FOOD">Food</option>
                                    <option value="TAXI">Taxi</option>
                                    <option value="PHARMACY">Pharmacy</option>
                                    <option value="RESTAURANT">Restaurant</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                            <div>
                                <input type="date" id="edit-date">
                            </div>
                            <div class="modal-buttons">
                                <button id="save-edit">Save</button>
                                <button id="cancel-edit">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="wrapper add-expense">
                <h1>Add expense</h1>
                <p id="error-message"></p>
                <p id="success-message"></p>
                <form id="add-expense-form">
                    <div>
                        <input type="number" name="amount" id="amount-input" placeholder="Add amount">
                    </div>
                    <div>
                        <select id="category-select">
                            <option value="" disabled selected hidden>Select category</option>
                            <option value="CLOTHING">Clothing</option>
                            <option value="FOOD">Food</option>
                            <option value="TAXI">Taxi</option>
                            <option value="PHARMACY">Pharmacy</option>
                            <option value="RESTAURANT">Restaurant</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div>
                        <input id="date-input" name="date" type="date">
                    </div>
                    <button type="submit">Add expense</button>
                </form>
            </div>
        </div>
    </body>
</html>
